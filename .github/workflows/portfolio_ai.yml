name: Portfolio AI Daily Analysis

on:
  schedule:
    # 3:45 PM IST (Mon-Fri) — main daily analysis
    - cron: '15 10 * * 1-5'
    # 9:00 AM IST (Mon-Fri) — approval checker: read YES replies, store PENDING BUY
    - cron: '30 3 * * 1-5'
    # 9:20 AM IST (Mon-Fri) — morning job: execute pending sells + pending buys at open price
    - cron: '50 3 * * 1-5'
    # 8:00 AM IST Saturday — weekly summary (+ separate accuracy email with PDF)
    - cron: '30 2 * * 6'
    # 7:00 AM IST Sunday — weekly Google Sheets backup (Flaw 5.3)
    - cron: '30 1 * * 0'
    # NOTE: Month-end summary is sent from inside main.py (should_send_monthly()),
    #       so there is no separate monthly cron and no duplicate monthly email.

  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'analysis'
        type: choice
        options:
          - analysis
          - morning_approvals
          - morning_sells
          - weekly
          - monthly
          - backup

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Secrets are available to every step; the failure e-mail step needs them too.
    env:
      EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER:  ${{ secrets.EMAIL_RECEIVER }}
      GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread google-auth yfinance ta groq flask pandas openpyxl requests beautifulsoup4 reportlab

      - name: Create credentials file
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Create config file
        run: |
          cat > config.py << 'EOF'
          import os
          EMAIL_SENDER            = os.environ.get("EMAIL_SENDER", "")
          EMAIL_PASSWORD          = os.environ.get("EMAIL_PASSWORD", "")
          EMAIL_RECEIVER          = os.environ.get("EMAIL_RECEIVER", "")
          GROQ_API_KEY            = os.environ.get("GROQ_API_KEY", "")
          GROQ_MODEL              = "openai/gpt-oss-120b"
          GROQ_FALLBACK_MODELS    = ["openai/gpt-oss-20b", "qwen/qwen3.6-27b"]
          GROQ_TPM_BUDGET         = 6500
          GEMINI_API_KEY          = ""
          ALPHA_VANTAGE_KEY       = ""
          GOOGLE_SHEET_ID         = os.environ.get("GOOGLE_SHEET_ID", "")
          GOOGLE_CREDENTIALS_FILE = "credentials.json"
          USE_GOOGLE_SHEETS       = True
          SELL_LOSS_THRESHOLD     = -20
          SELL_PROFIT_THRESHOLD   = 70
          RUN_HOUR                = 15
          RUN_MINUTE              = 45
          NSE_SUFFIX              = ".NS"
          HOLDINGS                = []
          HOLDINGS_SHEET          = "Sheet1"
          PNL_SHEET               = "Sheet3"
          EXCEL_FILE_PATH         = ""
          EOF

      # ── Decide which job to run: by the cron that fired (not by the clock) ──
      - name: Detect job type
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE:   ${{ github.event.schedule }}
          INPUT_JOB:  ${{ github.event.inputs.job }}
        run: |
          JOB="analysis"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOB="${INPUT_JOB:-analysis}"
          else
            case "$SCHEDULE" in
              '30 3 * * 1-5')  JOB="morning_approvals" ;;   # 9:00 AM IST
              '50 3 * * 1-5')  JOB="morning_sells" ;;       # 9:20 AM IST
              '15 10 * * 1-5') JOB="analysis" ;;            # 3:45 PM IST
              '30 2 * * 6')    JOB="weekly" ;;              # Sat 8:00 AM IST
              '30 1 * * 0')    JOB="backup" ;;              # Sun 7:00 AM IST
              *) echo "Unknown schedule '$SCHEDULE'"; exit 1 ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Detected job: $JOB (event=$EVENT_NAME schedule='$SCHEDULE')"

      # ── 9:00 AM IST: Read Gmail replies, store PENDING BUY in PendingBuys sheet ──
      - name: Run approval checker (9:00 AM IST)
        if: steps.detect.outputs.job == 'morning_approvals'
        run: python approval_checker.py

      # ── 9:20 AM IST: Execute pending sells + pending buys at actual open price ──
      - name: Run morning job (9:20 AM IST)
        if: steps.detect.outputs.job == 'morning_sells'
        run: python main.py --morning

      # ── Daily analysis (3:45 PM IST) — also sends the monthly summary on the last day ──
      - name: Run daily analysis (3:45 PM IST)
        if: steps.detect.outputs.job == 'analysis'
        run: python main.py

      # ── Weekly summary (Saturday 8:00 AM IST) ──────────────────────────────
      - name: Run weekly summary (Saturday)
        if: steps.detect.outputs.job == 'weekly'
        run: python weekly_monthly_summary.py --weekly

      # ── Monthly summary (manual run only; the scheduled one comes from main.py) ──
      - name: Run monthly summary (manual)
        if: steps.detect.outputs.job == 'monthly'
        run: python weekly_monthly_summary.py --monthly

      # ── Sunday backup (Flaw 5.3) ────────────────────────────────────────────
      - name: Run Google Sheets backup (Sunday)
        if: steps.detect.outputs.job == 'backup'
        run: python sheets_handler.py --backup

      - name: Commit backup to repo (keep only the latest)
        if: steps.detect.outputs.job == 'backup'
        run: |
          git config user.name "Portfolio AI Bot"
          git config user.email "bot@portfolio-ai.com"

          KEEP=1   # how many backup files to keep in the repo
          LATEST=$(ls backup_*.json 2>/dev/null | sort | tail -n 1)

          # Only prune if a real backup exists (file present and not tiny)
          if [ -n "$LATEST" ] && [ "$(stat -c%s "$LATEST")" -gt 1000 ]; then
            git add "$LATEST"
            # delete every backup except the newest $KEEP
            ls backup_*.json | sort | head -n -$KEEP | while read -r old; do
              git rm -f --quiet "$old" || true
            done
          else
            echo "No valid new backup found - nothing pruned."
          fi

          git diff --staged --quiet || git commit -m "Weekly backup $(date '+%Y-%m-%d') (older backups pruned)"
          git push || true

      # ── Deploy dashboard to GitHub Pages ───────────────────────────────────
      - name: Deploy dashboard
        if: steps.detect.outputs.job == 'analysis'
        run: |
          if [ -f last_analysis.json ]; then
            cp last_analysis.json portfolio_data.json
          fi
          git config user.name "Portfolio AI Bot"
          git config user.email "bot@portfolio-ai.com"
          git add portfolio_data.json || true
          git diff --staged --quiet || git commit -m "Update portfolio data $(date '+%Y-%m-%d %H:%M')"
          git push || true

      # ── If anything above failed, tell the owner (a silent failure = no sells, no scout) ──
      - name: Email on failure
        if: failure()
        env:
          JOB_NAME: ${{ steps.detect.outputs.job || 'unknown' }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - << 'PY'
          import os
          try:
              from email_handler import send_report_email
              job, url = os.environ.get("JOB_NAME", "unknown"), os.environ.get("RUN_URL", "")
              body = (f'<html><body style="font-family:Arial,sans-serif;">'
                      f'<h2 style="color:#B71C1C;">Portfolio AI job FAILED: {job}</h2>'
                      f'<p>The scheduled job did not finish. Open the run log to see why:</p>'
                      f'<p><a href="{url}">{url}</a></p></body></html>')
              send_report_email(f"❌ Portfolio AI job FAILED: {job}", body)
          except Exception as e:
              print(f"Could not send failure email: {e}")
          PY
